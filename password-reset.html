<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<title>Reset password · Incrementum</title><link rel="stylesheet" href="/styles.css">
<script type="module" src="/auth-page.mjs"></script>
</head><body data-purpose="recovery">
<header><nav class="nav"><a class="brand" href="/">Incrementum</a></nav></header>
<main><h1>Reset password</h1><p id="message" role="status" aria-live="polite">Continue to verify this email link. Opening this page alone does not confirm or reset your account.</p>
<button id="verify" type="button">Continue to reset password</button>
<form id="password-form" hidden>
  <label for="password">New password</label><input id="password" type="password" autocomplete="new-password" maxlength="128" required>
  <p id="helper"></p>
  <label for="confirmation">Retype new password</label><input id="confirmation" type="password" autocomplete="new-password" maxlength="128" required>
  <label><input id="show-password" type="checkbox"> Show passwords</label>
  <button type="submit">Save new password</button>
</form>
<button id="cancel" type="button">Cancel</button>
<noscript>Enable JavaScript to verify this link, or return to Incrementum to request another email.</noscript>
<p>Need help? <a href="/support.html">Incrementum Support</a>. Never share a password or email link.</p>
</main></body></html>
